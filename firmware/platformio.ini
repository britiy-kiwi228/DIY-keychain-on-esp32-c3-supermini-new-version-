; ==========================================================================
; PlatformIO Project Configuration for ESP32-C3 SuperMini Digital Keychain
; ==========================================================================

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Target: 160MHz CPU, 80MHz Flash QIO
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.filesystem = littlefs

; Partition Table: 4MB Flash (1.3MB App, 2.5MB LittleFS data partition)
board_build.partitions = default_littlefs.csv

; Monitor configuration for USB-CDC Serial
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Hardware Build Flags
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    
    ; --- TFT_eSPI Configuration for ST7789 240x240 on ESP32-C3 ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=6
    -DTFT_SCLK=4
    -DTFT_CS=7
    -DTFT_DC=5
    -DTFT_RST=3
    -DTFT_BL=2
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; Required Libraries
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bitbankh/AnimatedGIF@^2.1.1
    ricmoo/QRCode@^0.0.1
