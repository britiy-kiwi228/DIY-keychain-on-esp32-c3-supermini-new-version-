; ==========================================================================
; PlatformIO Project Configuration for ESP32-C3 SuperMini Digital Keychain
; ==========================================================================

[env:esp32-c3-supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino

; Target: 160MHz CPU, 80MHz Flash QIO
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.filesystem = littlefs

; Partition Table: 4MB Flash (1.3MB App, 2.5MB LittleFS data partition)
board_build.partitions = default_littlefs.csv

; Monitor configuration for USB-CDC Serial
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; Hardware Build Flags
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DSPI_START_END_TRANSACTION=1
    
    ; --- TFT_eSPI Configuration for ST7789 240x240 on ESP32-C3 ---
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=6
    -D TFT_SCLK=4
    -D TFT_CS=7
    -D TFT_DC=5
    -D TFT_RST=3
    -D TFT_BL=2
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_MISO=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
; Required Libraries
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    ricmoo/QRCode@^0.0.1

